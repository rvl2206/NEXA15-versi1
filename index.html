<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NEXA15 - SMA Negeri 15 Ambon Digital Presence</title>
    <meta name="description" content="Sistem Presensi Digital &amp; Manajemen Kehadiran Siswa/Guru dengan QR Code, Kartu Fisik RFID/NFC, AI Analysis, dan Pengaturan Identitas &amp; Logo Sekolah Terpusat." />
    <meta property="og:title" content="NEXA15 - SMA Negeri 15 Ambon Digital Presence" />
    <meta property="og:description" content="Sistem Presensi Digital &amp; Manajemen Kehadiran Siswa/Guru dengan QR Code, Kartu Fisik RFID/NFC, AI Analysis, dan Pengaturan Identitas &amp; Logo Sekolah Terpusat." />
    
    <!-- Premium Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet" />
    <script>
      // Global Error Handler - Prevents persistent blank screen
      window.addEventListener('error', function(e) {
        console.error('NEXA15 Boot Error:', e.error || e.message);
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.querySelector('.initial-loader'))) {
          var rawMsg = e && (e.message || (e.error && e.error.message)) ? String(e.message || e.error.message) : 'Terjadi kendala saat memuat modul aplikasi.';
          var safeDiv = document.createElement('div');
          safeDiv.textContent = rawMsg;
          var safeErrorMsg = safeDiv.innerHTML;
          root.innerHTML = '<div style="min-height:100vh;background:#020617;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif">' +
            '<div style="max-width:440px;width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:24px;padding:32px;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)">' +
            '<div style="width:48px;height:48px;background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);border-radius:16px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#f87171">⚠️</div>' +
            '<h2 style="font-size:18px;font-weight:800;color:#ffffff;margin:0 0 8px">Gagal Memuat Komponen</h2>' +
            '<p style="font-size:13px;color:#94a3b8;line-height:1.5;margin-bottom:16px">' + safeErrorMsg + '</p>' +
            '<button onclick="if(window.caches){caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k)})})};if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})})};location.reload(true)" style="background:#2563eb;color:#ffffff;border:none;padding:12px 20px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;width:100%">Segarkan Halaman & Bersihkan Cache Aset</button>' +
            '</div></div>';
        }
      });
    </script>
    <style>
      @keyframes nexa-spin {
        to { transform: rotate(360deg); }
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      /* Anti-flicker Hardware Acceleration Optimization for Kiosk Video */
      #nexa-kiosk-video-feed {
        width: 100% !important;
        height: 100% !important;
        position: relative !important;
        overflow: hidden !important;
        background-color: #000000 !important;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      #nexa-kiosk-video-feed video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        will-change: transform;
      }
      #nexa-kiosk-video-feed.high-contrast video,
      #reader.high-contrast video {
        filter: contrast(1.35) brightness(1.15) saturate(1.20) !important;
        -webkit-filter: contrast(1.35) brightness(1.15) saturate(1.20) !important;
      }
      #nexa-kiosk-video-feed canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        pointer-events: none !important;
        opacity: 0 !important;
      }
      #nexa-kiosk-video-feed img {
        display: none !important;
      }
      #nexa-kiosk-video-feed > div {
        border: none !important;
      }
      #nexa-kiosk-video-feed__scan_region {
        background: transparent !important;
      }
      #nexa-kiosk-video-feed__dashboard_section_csr {
        display: none !important;
      }
      .initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .initial-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: nexa-spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-spinner"></div>
        <div style="font-weight: 800; font-size: 16px; letter-spacing: 0.05em; color: #ffffff;">NEXA15 SMART</div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">SMA Negeri 15 Ambon</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
